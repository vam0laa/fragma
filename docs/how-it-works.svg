<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Without fragma the blocking box reads the site name and cuts the connection. With fragma the first message is split in two TLS records, the box cannot read the name and the server puts it back together.">
<rect width="960" height="470" rx="14" fill="#0d1117"/><rect x=".5" y=".5" width="959" height="469" rx="13.5" fill="none" stroke="#30363d"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<text x="30" y="40" font-size="17" fill="#ff7b72" text-anchor="start" font-weight="600">Without fragma</text>
<rect x="30" y="100" width="140" height="76" rx="9" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
<text x="100" y="134" font-size="15" fill="#f0f6fc" text-anchor="middle" font-weight="600">Your app</text>
<text x="100" y="155" font-size="12" fill="#8b949e" text-anchor="middle">browser, Discord…</text>
<rect x="450" y="100" width="170" height="76" rx="9" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
<text x="535" y="134" font-size="15" fill="#f0f6fc" text-anchor="middle" font-weight="600">ISP blocking box</text>
<text x="535" y="155" font-size="12" fill="#8b949e" text-anchor="middle">looks for the site name</text>
<rect x="790" y="100" width="140" height="76" rx="9" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
<text x="860" y="134" font-size="15" fill="#f0f6fc" text-anchor="middle" font-weight="600">Server</text>
<text x="860" y="155" font-size="12" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">discord.com</text>
<text x="310" y="100" font-size="12" fill="#8b949e" text-anchor="middle">first TLS message</text>
<rect x="240" y="109" width="140" height="30" rx="9" fill="#0d1117" stroke="#f85149" stroke-width="1.5"/>
<text x="310.0" y="129" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">discord.com</text>
<line x1="175" y1="160" x2="438" y2="160" stroke="#c9d1d9" stroke-width="2"/><path d="M436 155L446 160L436 165Z" fill="#c9d1d9"/>
<line x1="625" y1="138" x2="778" y2="138" stroke="#484f58" stroke-width="2" stroke-dasharray="5 5"/><path d="M776 133L786 138L776 143Z" fill="#484f58"/>
<circle cx="705" cy="138" r="15" fill="#0d1117" stroke="#f85149" stroke-width="2"/><path d="M699 132L711 144M711 132L699 144" stroke="#f85149" stroke-width="2.5"/>
<text x="705" y="180" font-size="13" fill="#ff7b72" text-anchor="middle">connection cut</text>
<text x="535" y="206" font-size="13" fill="#ff7b72" text-anchor="middle">“I see discord.com — block it”</text>
<line x1="30" y1="232" x2="930" y2="232" stroke="#30363d"/>
<text x="30" y="268" font-size="17" fill="#7ee787" text-anchor="start" font-weight="600">With fragma</text>
<rect x="30" y="328" width="140" height="76" rx="9" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
<text x="100" y="362" font-size="15" fill="#f0f6fc" text-anchor="middle" font-weight="600">Your app</text>
<text x="100" y="383" font-size="12" fill="#8b949e" text-anchor="middle">browser, Discord…</text>
<rect x="450" y="328" width="170" height="76" rx="9" fill="#161b22" stroke="#484f58" stroke-width="1.5"/>
<text x="535" y="362" font-size="15" fill="#f0f6fc" text-anchor="middle" font-weight="600">ISP blocking box</text>
<text x="535" y="383" font-size="12" fill="#8b949e" text-anchor="middle">looks for the site name</text>
<rect x="790" y="328" width="140" height="76" rx="9" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
<text x="860" y="362" font-size="15" fill="#f0f6fc" text-anchor="middle" font-weight="600">Server</text>
<text x="860" y="383" font-size="12" fill="#8b949e" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">discord.com</text>
<text x="310" y="305" font-size="12" fill="#8b949e" text-anchor="middle">same message, cut inside the name</text>
<text x="310" y="320" font-size="12" fill="#8b949e" text-anchor="middle">into two valid TLS records</text>
<rect x="222" y="337" width="80" height="30" rx="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
<text x="262.0" y="357" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">disco</text>
<rect x="318" y="337" width="80" height="30" rx="9" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
<text x="358.0" y="357" font-size="13" fill="#f0f6fc" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,'DejaVu Sans Mono',monospace">rd.com</text>
<line x1="175" y1="388" x2="438" y2="388" stroke="#3fb950" stroke-width="2"/><path d="M436 383L446 388L436 393Z" fill="#3fb950"/>
<line x1="625" y1="366" x2="778" y2="366" stroke="#3fb950" stroke-width="2"/><path d="M776 361L786 366L776 371Z" fill="#3fb950"/>
<text x="705" y="350" font-size="13" fill="#7ee787" text-anchor="middle">passes</text>
<text x="535" y="434" font-size="13" fill="#8b949e" text-anchor="middle">“no blocked name here”</text>
<text x="860" y="434" font-size="13" fill="#7ee787" text-anchor="middle">puts the pieces together ✓</text>
</g></svg>
