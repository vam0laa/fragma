# Builds the release files. A tag vX.Y.Z on main ends in a DRAFT release, which a
# person looks at and publishes; nothing here publishes. A push that changes the
# release machinery rehearses everything up to that point. See docs/releasing.md.
name: release

on:
  push:
    tags: ["v*"]
    # paths apply to branch pushes only; every v* tag runs
    branches: ["**"]
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - Makefile
      - go.mod

# each job asks for what it needs
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: The tag must name this version and be on main
        if: github.ref_type == 'tag'
        run: |
          scripts/release/check.sh tag "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: The checks refuse what they should
        run: scripts/release/selftest.sh
      - name: Build and check
        run: |
          scripts/release/dist.sh
          CLEAN=1 scripts/release/check.sh dist dist
          cat dist/SHA256SUMS dist/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fragma-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  windows:
    name: the Windows file runs on Windows
    needs: build
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fragma-dist
          path: dist
      - shell: pwsh
        run: |
          $manifest = Get-Content dist/manifest.json -Raw | ConvertFrom-Json
          $entry = $manifest.files | Where-Object os -eq windows
          $hash = (Get-FileHash "dist/$($entry.name)" -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $entry.sha256) { throw "checksum of $($entry.name) is $hash" }
          Expand-Archive "dist/$($entry.name)" out
          $said = & ./out/fragma.exe version
          if ($said -ne "fragma $($manifest.version)") { throw "the program says '$said'" }
          Write-Output "$said, sha256 $hash"

  # only for tags: proof, signed by GitHub, that this workflow built these files
  attest:
    needs: [build, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fragma-dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  draft:
    name: draft release (not published)
    needs: attest
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fragma-dist
          path: dist
      - name: Checksums and provenance
        run: |
          (cd dist && sha256sum --strict -c SHA256SUMS)
          for f in dist/*; do
              gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-ref "$GITHUB_REF"
          done
      - name: Create the draft
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              echo "::error::a release for $GITHUB_REF_NAME already exists; nothing was changed"
              exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          echo "Draft created. Read it and publish it by hand." >> "$GITHUB_STEP_SUMMARY"
