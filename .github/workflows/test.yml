name: test

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      # changes the proxy settings of the runner, which is thrown away afterwards
      - name: Windows recovery, against the real settings
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go build -o fragma.exe .
          FRAGMA_WIN_INTEGRATION=1 FRAGMA_BIN="$(cygpath -w "$PWD/fragma.exe")" go test -count=1 -run Integration -v .

  e2e:
    name: system-wide mode, end to end (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ubuntu 24.04 blocks unprivileged user namespaces; the test needs one
      # (it never touches the runner's real network).
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get update && sudo apt-get install -y nftables iproute2
      - run: make e2e
